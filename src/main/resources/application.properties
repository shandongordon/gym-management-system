spring.application.name=elevate-fitness
server.port=8080
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.include-message=never

# Development-only local MySQL 8.4 configuration.
# Create database/user first using sql/setup.sql.
# Never put your real DB password in source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elevate_fitness?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:elevate_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Class prototype only: JPA creates/updates the tables. Use migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Educational local demo only. Deploy with HTTPS, TLS, and secure session cookies.
# server.servlet.session.cookie.secure=true
