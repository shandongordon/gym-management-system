<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Selected Member | Elevate Fitness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-body">
    <div th:replace="~{fragments/layout :: sidebar('members')}"></div>
    <main class="main-content">
        <h1 class="page-title">Member Search</h1>
        <section class="content-card selected-card">
            <h2>Selected Member</h2>
            <div class="details-grid">
                <div><span class="field-caption">Member ID:</span><strong th:text="${member.memberId}">1001</strong></div>
                <div><span class="field-caption">Full Name:</span><strong th:text="${member.fullName}">Yuji Itadori</strong></div>
                <div><span class="field-caption">Email:</span><span th:text="${member.email}">yuji.itadori@example.test</span></div>
                <div><span class="field-caption">Phone Number:</span><span th:text="${member.phoneNumber}">305-555-0101</span></div>
            </div>
            <p class="handoff-note"><strong>Integration handoff:</strong> This member is selected. The next phase is Membership Verification and Attendance &amp; Check-In, developed by Member 3.</p>
            <div class="actions"><a class="btn-outline-app" th:href="@{/members}">Back to Search</a></div>
        </section>
    </main>
</div>
</body>
</html>
