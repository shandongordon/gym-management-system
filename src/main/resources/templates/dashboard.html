<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Dashboard | Elevate Fitness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-body">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <main class="main-content">
        <h1 class="page-title">Dashboard</h1>
        <section class="content-card dashboard-intro">
            <h2>Front Desk Dashboard</h2>
            <p class="muted">Access member records and continue to membership verification.</p>
        </section>
        <section class="content-card dashboard-action">
            <h2>Member Search</h2>
            <p class="muted">Find a gym member by member ID or full name.</p>
            <a class="btn-primary-app" th:href="@{/members}">Search Members</a>
        </section>
    </main>
</div>
</body>
</html>
