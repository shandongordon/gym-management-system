<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Employee Login | Elevate Fitness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
    <script defer th:src="@{/js/login.js}" src="/js/login.js"></script>
</head>
<body class="login-page">
<header class="topbar">
    <div class="brand"><span class="brand-logo">LOGO</span><span>Elevate Fitness</span></div>
</header>
<main class="login-main">
    <section class="login-card" aria-labelledby="login-heading">
        <h1 id="login-heading">Employee Login</h1>
        <p class="muted">Sign in to access the gym management system.</p>
        <div id="server-error" class="alert-message error" hidden role="alert">Invalid username or password.</div>
        <div id="logged-out" class="alert-message success" hidden role="status">You have successfully logged out.</div>
        <div id="form-error" class="alert-message error" hidden role="alert"></div>
        <form id="loginForm" th:action="@{/login}" action="/login" method="post" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="80" autofocus/>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="150"/>
            <button class="btn-primary-app btn-full" type="submit">Login</button>
        </form>
    </section>
</main>
</body>
</html>
