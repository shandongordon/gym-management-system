<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Member Search | Elevate Fitness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
    <script defer th:src="@{/js/member-search.js}" src="/js/member-search.js"></script>
</head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-body">
    <div th:replace="~{fragments/layout :: sidebar('members')}"></div>
    <main class="main-content">
        <h1 class="page-title">Member Search</h1>
        <section class="content-card">
            <h2>Search Members</h2>
            <form id="member-search-form" class="search-form" novalidate>
                <div class="field-stack">
                    <label for="member-query">Member ID or Full Name</label>
                    <input id="member-query" name="query" type="search" maxlength="100"
                           placeholder="Enter member ID or name" autocomplete="off"/>
                </div>
                <button type="submit" class="btn-primary-app search-button">
                    <svg class="icon"><use href="/images/icons.svg#search"></use></svg>Search
                </button>
            </form>
            <p id="search-message" class="search-message" aria-live="polite"></p>
        </section>
        <section id="results-section" class="content-card results-card" hidden>
            <h2>Search Results</h2>
            <div class="table-scroll">
                <table class="members-table">
                    <thead><tr><th>Member ID</th><th>Full Name</th><th>Email</th><th></th></tr></thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
